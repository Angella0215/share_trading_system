<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Broker Dashboard - Stockbrokers Malawi Limited</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-logo">
        <span class="mark">SML</span>
        Stockbrokers Malawi
      </div>

      <nav class="sidebar-nav">
        <a href="dashboard.html" class="active">Dashboard</a>
        <a href="accounts.html">Account Applications</a>
        <a href="orders.html">Orders</a>
        <a href="messages.html">Messages</a>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="avatar" id="userAvatar">?</div>
          <div>
            <div class="name" id="userName">Loading...</div>
            <div class="role">Broker</div>
          </div>
        </div>
        <button class="logout-btn" onclick="logout()">Log out</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <div>
          <h1>Broker Dashboard</h1>
          <p>A summary of what needs your attention.</p>
        </div>
      </div>

      <div class="stat-cards">
        <div class="stat-card">
          <div class="label">Pending account applications</div>
          <div class="value" id="statPendingAccounts">-</div>
        </div>
        <div class="stat-card">
          <div class="label">Pending buy orders</div>
          <div class="value" id="statPendingBuys">-</div>
        </div>
        <div class="stat-card">
          <div class="label">Pending sell orders</div>
          <div class="value" id="statPendingSells">-</div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-title">Quick links</div>
        </div>
        <div style="display:flex; gap:16px; flex-wrap:wrap;">
          <a href="accounts.html" class="btn btn-primary">Review account applications</a>
          <a href="orders.html" class="btn btn-outline">Review pending orders</a>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/session.js"></script>
  <script src="../js/broker-dashboard.js"></script>
</body>
</html>
