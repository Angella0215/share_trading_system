<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account Applications - Stockbrokers Malawi Limited</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-logo">
        <span class="mark">SML</span>
        Stockbrokers Malawi
      </div>

      <nav class="sidebar-nav">
        <a href="dashboard.html">Dashboard</a>
        <a href="accounts.html" class="active">Account Applications</a>
        <a href="orders.html">Orders</a>
        <a href="messages.html">Messages</a>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="avatar" id="userAvatar">?</div>
          <div>
            <div class="name" id="userName">Loading...</div>
            <div class="role">Broker</div>
          </div>
        </div>
        <button class="logout-btn" onclick="logout()">Log out</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <div>
          <h1>Account Applications</h1>
          <p>Review pending investor KYC applications and their supporting documents.</p>
        </div>
      </div>

      <div class="alert alert-success" id="successAlert"></div>

      <div id="applicationsWrap">
        <div class="empty-state">Loading applications...</div>
      </div>
    </main>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/session.js"></script>
  <script src="../js/broker-accounts.js"></script>

</html>
