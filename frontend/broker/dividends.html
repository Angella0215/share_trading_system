<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dividends - Stockbrokers Malawi Limited</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-logo">
        <span class="mark">SML</span>
        Stockbrokers Malawi
      </div>

      <nav class="sidebar-nav">
        <a href="dashboard.html">Dashboard</a>
        <a href="accounts.html">Account Applications</a>
        <a href="orders.html">Orders</a>
        <a href="history.html">Order History</a>
        <a href="dividends.html" class="active">Dividends</a>
        <a href="messages.html">Messages</a>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="avatar" id="userAvatar">?</div>
          <div>
            <div class="name" id="userName">Loading...</div>
            <div class="role">Broker</div>
          </div>
        </div>
        <button class="logout-btn" onclick="logout()">Log out</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <div>
          <h1>Dividends</h1>
          <p>Review the payout list, give first and final approval (two different brokers), then mark it as paid.</p>
        </div>
      </div>

      <div class="card" style="margin-bottom:24px;">
        <div class="card-header"><div class="card-title">Dividends</div></div>
        <div id="dividendsWrap">
          <div class="empty-state">Loading dividends...</div>
        </div>
      </div>

      <div class="card" id="payoutsCard" style="display:none;">
        <div class="card-header"><div class="card-title" id="payoutsTitle">Payouts</div></div>
        <div id="payoutsWrap"></div>
      </div>
    </main>
  </div>

  <script>const DIVIDEND_ROLE = 'broker';</script>
  <script src="../js/config.js"></script>
  <script src="../js/session.js"></script>
  <script src="../js/dividends-manage.js"></script>
</body>
</html>
