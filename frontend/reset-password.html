<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password - Stockbrokers Malawi Limited</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="brand-logo">
      <span class="mark">SML</span>
      Stockbrokers Malawi
    </div>
  </nav>

  <main class="auth-shell" style="grid-template-columns: 1fr;">
    <section class="auth-form-side" style="max-width:440px; margin:0 auto;">
      <div class="form-header">
        <h2>Set a new password</h2>
        <p>Enter a new password for your account.</p>
      </div>

      <div class="alert alert-error" id="errorAlert"></div>
      <div class="alert alert-success" id="successAlert"></div>

      <form id="resetForm" novalidate>
        <div class="field">
          <label for="newPassword">New password</label>
          <input type="password" id="newPassword" name="newPassword" placeholder="At least 6 characters">
        </div>

        <div class="field">
          <label for="confirmPassword">Confirm new password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repeat new password">
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Reset password</button>
      </form>

      <p class="auth-switch">
        <a href="index.html">Back to log in</a>
      </p>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/reset-password.js"></script>
</body>
</html>
