<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orders - Stockbrokers Malawi Limited</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-logo">
        <span class="mark">SML</span>
        Stockbrokers Malawi
      </div>

      <nav class="sidebar-nav">
        <a href="dashboard.html">Dashboard</a>
        <a href="users.html">Users</a>
        <a href="companies.html">Companies</a>
        <a href="orders.html" class="active">Orders</a>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="avatar" id="userAvatar">?</div>
          <div>
            <div class="name" id="userName">Loading...</div>
            <div class="role">Admin</div>
          </div>
        </div>
        <button class="logout-btn" onclick="logout()">Log out</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <div>
          <h1>Pending Orders</h1>
          <p>Review and approve buy and sell orders placed by investors.</p>
        </div>
      </div>

      <div class="alert alert-success" id="successAlert"></div>

      <div class="card" style="margin-bottom:24px;">
        <div class="card-header"><div class="card-title">Buy orders</div></div>
        <div id="buyOrdersWrap">
          <div class="empty-state">Loading buy orders...</div>
        </div>
      </div>

      <div class="card">
        <div class="card-header"><div class="card-title">Sell orders</div></div>
        <div id="sellOrdersWrap">
          <div class="empty-state">Loading sell orders...</div>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/session.js"></script>
  <script src="../js/admin-orders.js"></script>
</body>
</html>
