<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - Stockbrokers Malawi Limited</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-logo">
        <span class="mark">SML</span>
        Stockbrokers Malawi
      </div>

      <nav class="sidebar-nav">
        <a href="dashboard.html" class="active">Dashboard</a>
        <a href="users.html">Users</a>
        <a href="companies.html">Companies</a>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="avatar" id="userAvatar">?</div>
          <div>
            <div class="name" id="userName">Loading...</div>
            <div class="role">Admin</div>
          </div>
        </div>
        <button class="logout-btn" onclick="logout()">Log out</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <div>
          <h1>Admin Dashboard</h1>
          <p>System overview.</p>
        </div>
      </div>

      <div class="stat-cards">
        <div class="stat-card">
          <div class="label">Total users</div>
          <div class="value" id="statTotalUsers">-</div>
        </div>
        <div class="stat-card">
          <div class="label">Total investors</div>
          <div class="value" id="statInvestors">-</div>
        </div>
        <div class="stat-card">
          <div class="label">Listed companies</div>
          <div class="value" id="statCompanies">-</div>
        </div>
      </div>

      <div class="card">
        <div class="card-header"><div class="card-title">Quick links</div></div>
        <div style="display:flex; gap:16px; flex-wrap:wrap;">
          <a href="users.html" class="btn btn-primary">Manage users</a>
          <a href="companies.html" class="btn btn-outline">Manage companies & prices</a>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/session.js"></script>
  <script src="../js/admin-dashboard.js"></script>
</body>
</html>
