<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order History - Stockbrokers Malawi Limited</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-logo">
        <span class="mark">SML</span>
        Stockbrokers Malawi
      </div>

      <nav class="sidebar-nav">
        <a href="dashboard.html">Dashboard</a>
        <a href="account.html">My Account</a>
        <a href="companies.html">Companies</a>
        <a href="buy.html">Buy Shares</a>
        <a href="sell.html">Sell Shares</a>
        <a href="portfolio.html">Portfolio</a>
        <a href="orders.html" class="active">Order History</a>
        <a href="messages.html">Messages</a>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="avatar" id="userAvatar">?</div>
          <div>
            <div class="name" id="userName">Loading...</div>
            <div class="role">Investor</div>
          </div>
        </div>
        <button class="logout-btn" onclick="logout()">Log out</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <div>
          <h1>Order History</h1>
          <p>All your buy and sell orders, most recent first.</p>
        </div>
      </div>
      <div class="card">
        <div style="text-align:right; margin-bottom:16px;">
          <button class="btn btn-outline btn-sm" onclick="downloadStatement('transactions')">Download Transaction Statement (PDF)</button>
        </div>
        <div id="ordersTableWrap">
     
          <div class="empty-state">Loading your orders...</div>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/session.js"></script>
  <script src="../js/orders.js"></script>
</body>
</html>
