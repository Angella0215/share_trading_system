<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages - Stockbrokers Malawi Limited</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-logo">
        <span class="mark">SML</span>
        Stockbrokers Malawi
      </div>

      <nav class="sidebar-nav">
        <a href="dashboard.html">Dashboard</a>
        <a href="account.html">My Account</a>
        <a href="companies.html">Companies</a>
        <a href="buy.html">Buy Shares</a>
        <a href="sell.html">Sell Shares</a>
        <a href="portfolio.html">Portfolio</a>
        <a href="orders.html">Order History</a>
        <a href="messages.html" class="active">Messages</a>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="avatar" id="userAvatar">?</div>
          <div>
            <div class="name" id="userName">Loading...</div>
            <div class="role">Investor</div>
          </div>
        </div>
        <button class="logout-btn" onclick="logout()">Log out</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <div>
          <h1>Messages</h1>
          <p>Contact your broker directly with any questions.</p>
        </div>
      </div>

      <div class="card" style="max-width:700px;">
        <div class="field">
          <label for="broker_id">Talk to</label>
          <select id="broker_id">
            <option value="">Select a broker...</option>
          </select>
        </div>

        <div id="chatThread" style="border:1px solid var(--border); border-radius:10px; padding:16px; height:360px; overflow-y:auto; margin-bottom:16px; background:var(--sky);">
          <div class="empty-state">Select a broker to view your conversation.</div>
        </div>

        <form id="messageForm" style="display:flex; gap:10px;">
          <input type="text" id="messageInput" placeholder="Type your message..." style="flex:1; padding:12px 14px; border:1.5px solid var(--border); border-radius:10px; font-family:var(--font-body); font-size:14.5px;">
          <button type="submit" class="btn btn-primary">Send</button>
        </form>
      </div>
    </main>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/session.js"></script>
  <script src="../js/messages.js"></script>
</body>
</html>
