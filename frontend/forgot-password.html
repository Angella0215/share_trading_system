<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password - Stockbrokers Malawi Limited</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="brand-logo">
      <span class="mark">SML</span>
      Stockbrokers Malawi
    </div>
  </nav>

  <main class="auth-shell" style="grid-template-columns: 1fr;">
    <section class="auth-form-side" style="max-width:440px; margin:0 auto;">
      <div class="form-header">
        <h2>Reset your password</h2>
        <p>Enter the email address on your account. We'll send you a link to reset your password.</p>
      </div>

      <div class="alert alert-error" id="errorAlert"></div>
      <div class="alert alert-success" id="successAlert"></div>

      <form id="forgotForm" novalidate>
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com">
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Send reset link</button>
      </form>

      <p class="auth-switch">
        <a href="index.html">Back to log in</a>
      </p>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/forgot-password.js"></script>
</body>
</html>
